name: CI Pipeline

on:
  push:
    branches:
      - master
env:
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord - Build Triggered
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🚀 A new build has been triggered on the master branch.\"}" \
               $DISCORD_WEBHOOK

  unit-tests:
    runs-on: ubuntu-latest
    needs: notify-start
    steps:
      - name: Checkout code
  # You may pin to the exact commit or the version.
  # uses: ArtyProf/dotnet-build-test-publish-action@ef989a2459b17ad6555bac39ebe489d9a9128daa
  uses: ArtyProf/dotnet-build-test-publish-action@v1.2.0
  with:
    # SonarCloud project key
    sonar-project-key: # optional, default is 
    # SonarCloud token
    sonar-token: # optional, default is 
    # SonarCloud organization
    sonar-organization: # optional, default is 
    # SonarCloud host url
    sonar-host-url: # optional, default is https://sonarcloud.io
    # Path to the dotnet solution file (.sln)
    dotnet-solution-path: # optional, default is 
    # Dotnet version for actions/setup-dotnet
    dotnet-version: # optional, default is 8.x
    # If you need to publish files to the artifact, you can type true
    is-need-publish: # optional, default is 
          
          
      - name: Report Unit Test Results
        if: failure()
        run: |
          TEST_ERROR=$(tail -n 10 /opt/unity/Editor/Unity.log)
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"❌ Unit tests failed on the master branch.\nError Details: ${TEST_ERROR}\"}" \
               $DISCORD_WEBHOOK

      - name: Publish Test Results
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"✅ Unit tests passed successfully on the master branch.\"}" \
               $DISCORD_WEBHOOK

  notify-end:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Notify Discord - Pipeline Completed
        run: |
          if [ "${{ needs.unit-tests.result }}" == "failure" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\": \"⚠️ The CI pipeline completed with errors on the master branch.\"}" \
                 $DISCORD_WEBHOOK
          else
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\": \"🎉 The CI pipeline completed successfully on the master branch.\"}" \
                 $DISCORD_WEBHOOK
          fi
